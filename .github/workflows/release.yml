name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - LICENSE
  workflow_dispatch:
    inputs:
      version:
        description: Existing GitHub release version to publish to npm, without the v prefix
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      release-sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package-release:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release-created == 'true' || inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve release ref
        id: ref
        env:
          AUTOMATIC_SHA: ${{ needs.release-please.outputs.release-sha }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$MANUAL_VERSION" ]; then
            if ! [[ "$MANUAL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid semantic version: $MANUAL_VERSION" >&2
              exit 1
            fi
            echo "ref=v$MANUAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$AUTOMATIC_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: |
          npm run check
          npm test
          npm run build
          npm pack --dry-run

      - name: Pack release
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact"
          npm pack --pack-destination "$RUNNER_TEMP/release-artifact"

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-package
          path: ${{ runner.temp }}/release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: package-release
    if: needs.package-release.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download release package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-release-package
          path: ${{ runner.temp }}/release-artifact

      - name: Resolve release package
        id: package
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/release-artifact/*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one release tarball, found ${#packages[@]}" >&2
            exit 1
          fi
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm as maintainer
        env:
          EXPECTED_NPM_USER: sezaienesyildizhan
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TARBALL: ${{ steps.package.outputs.path }}
        run: |
          publisher="$(npm whoami)"
          if [ "$publisher" != "$EXPECTED_NPM_USER" ]; then
            echo "Unexpected npm publisher: $publisher" >&2
            exit 1
          fi
          npm publish "$RELEASE_TARBALL" \
            --access public \
            --provenance \
            --ignore-scripts
